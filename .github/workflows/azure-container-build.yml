name: deploy-deep-research-to-azure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/azure-container-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "webapp/**"
      - ".github/workflows/azure-container-build.yml"

concurrency:
  group: deep-research-azure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      IMAGE_NAME: ${{ vars.IMAGE_NAME || 'deep-research' }}
      IMAGE_TAG: ${{ github.sha }}
      AZURE_CONTAINER_CPU: ${{ vars.AZURE_CONTAINER_CPU || '1' }}
      AZURE_CONTAINER_MEMORY: ${{ vars.AZURE_CONTAINER_MEMORY || '2' }}
      AZURE_CONTAINER_MIN_REPLICAS: ${{ vars.AZURE_CONTAINER_MIN_REPLICAS || '0' }}
      AZURE_CONTAINER_MAX_REPLICAS: ${{ vars.AZURE_CONTAINER_MAX_REPLICAS || '3' }}
      AZURE_CONTAINER_PORT: "3000"
      AZURE_HEALTHCHECK_PATH: "/"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Container Apps extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.AZURE_CONTAINER_REGISTRY }}"

      - name: Build and push Deep Research container image
        uses: docker/build-push-action@v6
        with:
          context: webapp
          file: webapp/Dockerfile.fullstack
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Render Container Apps manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > containerapp.yaml <<EOF
          location: "${{ vars.AZURE_LOCATION }}"
          name: "${{ vars.AZURE_CONTAINER_APP_NAME }}"
          properties:
            managedEnvironmentId: "/subscriptions/${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.App/managedEnvironments/${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}"
            configuration:
              ingress:
                external: true
                targetPort: ${{ env.AZURE_CONTAINER_PORT }}
                transport: auto
                allowInsecure: false
              registries:
                - server: "${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}"
                  identity: system
              secrets:
                - name: openai-api-key
                  value: "${{ secrets.OPENAI_API_KEY }}"
                - name: tavily-api-key
                  value: "${{ secrets.TAVILY_API_KEY }}"
                - name: azure-openai-api-key
                  value: "${{ secrets.AZURE_OPENAI_API_KEY }}"
                - name: xquik-api-key
                  value: "${{ secrets.XQUIK_API_KEY }}"
                - name: langchain-api-key
                  value: "${{ secrets.LANGCHAIN_API_KEY }}"
            template:
              containers:
                - name: deep-research
                  image: "${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
                  env:
                    - name: OPENAI_API_KEY
                      secretRef: openai-api-key
                    - name: TAVILY_API_KEY
                      secretRef: tavily-api-key
                    - name: AZURE_OPENAI_API_KEY
                      secretRef: azure-openai-api-key
                    - name: XQUIK_API_KEY
                      secretRef: xquik-api-key
                    - name: LANGCHAIN_API_KEY
                      secretRef: langchain-api-key
                    - name: OPENAI_BASE_URL
                      value: "${{ vars.OPENAI_BASE_URL }}"
                    - name: ENDPOINT_URL
                      value: "${{ vars.ENDPOINT_URL }}"
                    - name: DEPLOYMENT_NAME
                      value: "${{ vars.DEPLOYMENT_NAME }}"
                    - name: AZURE_OPENAI_ENDPOINT
                      value: "${{ vars.AZURE_OPENAI_ENDPOINT }}"
                    - name: AZURE_OPENAI_API_VERSION
                      value: "${{ vars.AZURE_OPENAI_API_VERSION }}"
                    - name: AZURE_API_VERSION
                      value: "${{ vars.AZURE_API_VERSION }}"
                    - name: FAST_LLM
                      value: "${{ vars.FAST_LLM }}"
                    - name: SMART_LLM
                      value: "${{ vars.SMART_LLM }}"
                    - name: STRATEGIC_LLM
                      value: "${{ vars.STRATEGIC_LLM }}"
                    - name: EMBEDDING
                      value: "${{ vars.EMBEDDING }}"
                    - name: DOC_PATH
                      value: "${{ vars.DOC_PATH }}"
                    - name: MAX_SCRAPER_WORKERS
                      value: "${{ vars.MAX_SCRAPER_WORKERS }}"
                    - name: SCRAPER_RATE_LIMIT_DELAY
                      value: "${{ vars.SCRAPER_RATE_LIMIT_DELAY }}"
                    - name: COMPRESSION_THRESHOLD
                      value: "${{ vars.COMPRESSION_THRESHOLD }}"
                    - name: LANGCHAIN_TRACING_V2
                      value: "${{ vars.LANGCHAIN_TRACING_V2 }}"
                    - name: LANGCHAIN_ENDPOINT
                      value: "${{ vars.LANGCHAIN_ENDPOINT }}"
                    - name: LANGCHAIN_PROJECT
                      value: "${{ vars.LANGCHAIN_PROJECT }}"
                    - name: FAST_TOKEN_LIMIT
                      value: "${{ vars.FAST_TOKEN_LIMIT }}"
                    - name: SMART_TOKEN_LIMIT
                      value: "${{ vars.SMART_TOKEN_LIMIT }}"
                    - name: STRATEGIC_TOKEN_LIMIT
                      value: "${{ vars.STRATEGIC_TOKEN_LIMIT }}"
                  resources:
                    cpu: ${{ env.AZURE_CONTAINER_CPU }}
                    memory: "${{ env.AZURE_CONTAINER_MEMORY }}Gi"
                  probes:
                    - type: Startup
                      httpGet:
                        path: "${{ env.AZURE_HEALTHCHECK_PATH }}"
                        port: ${{ env.AZURE_CONTAINER_PORT }}
                      failureThreshold: 30
                      periodSeconds: 10
                    - type: Liveness
                      httpGet:
                        path: "${{ env.AZURE_HEALTHCHECK_PATH }}"
                        port: ${{ env.AZURE_CONTAINER_PORT }}
                      initialDelaySeconds: 60
                      periodSeconds: 15
                    - type: Readiness
                      httpGet:
                        path: "${{ env.AZURE_HEALTHCHECK_PATH }}"
                        port: ${{ env.AZURE_CONTAINER_PORT }}
                      initialDelaySeconds: 30
                      periodSeconds: 10
              scale:
                minReplicas: ${{ env.AZURE_CONTAINER_MIN_REPLICAS }}
                maxReplicas: ${{ env.AZURE_CONTAINER_MAX_REPLICAS }}
          EOF

      - name: Create or update Azure Container App
        shell: bash
        run: |
          set -euo pipefail

          if az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" >/dev/null 2>&1; then
            az containerapp update \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --yaml containerapp.yaml \
              --output none
          else
            az containerapp create \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
              --yaml containerapp.yaml \
              --output none
          fi

      - name: Show deployed container app state
        run: |
          az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query "{provisioningState:properties.provisioningState,fqdn:properties.configuration.ingress.fqdn,image:properties.template.containers[0].image,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName}" \
            --output table
